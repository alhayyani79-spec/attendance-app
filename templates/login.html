<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial;
            background: #f2f2f2;
            position: relative;
        }

        /* MAIN TITLE */
        .title {
            position: absolute;
            top: 40px;
            width: 100%;
            text-align: center;
            font-size: 40px;
            font-weight: bold;
            color: #009639;
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.2);
            text-align: center;
            margin-top: 60px;
        }

        input {
            display: block;
            width: 250px;
            margin: 10px auto;
            padding: 10px;
        }

        button {
            padding: 10px 20px;
            background: #009639;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #007a2f;
        }

        .error {
            color: red;
            margin-top: 10px;
        }

        /* CREDITS BOTTOM LEFT */
        .credits {
            position: absolute;
            bottom: 10px;
            left: 10px;
            font-size: 11px;
            color: gray;
        }
    </style>
</head>

<body>

    <!-- TITLE -->
    <div class="title">
        Family Attendance List
    </div>

    <!-- LOGIN BOX -->
    <div class="login-box">

        <h2>Login</h2>

        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>

            <button type="submit">Login</button>
        </form>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

    </div>

    <!-- CREDITS -->
    <div class="credits">
        Done by: Mohammad Ammar, Khalid Abdullah and Hamad Ahmad
    </div>

</body>
</html>
