<!DOCTYPE html>
<html>
<head>

    <title>Login</title>

    <style>

        body{
            margin:0;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:Arial;
            background:#f4f7f5;
        }

        .login-box{
            width:350px;
            background:white;
            padding:40px;
            border-radius:20px;
            box-shadow:0 5px 20px rgba(0,0,0,0.1);
            text-align:center;
        }

        h1{
            color:#009639;
            margin-bottom:10px;
        }

        p{
            color:gray;
            margin-bottom:30px;
        }

        input{
            width:100%;
            padding:14px;
            margin-bottom:15px;
            border:1px solid #ddd;
            border-radius:10px;
            font-size:15px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:14px;
            background:#009639;
            color:white;
            border:none;
            border-radius:10px;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#00752d;
        }

        .error{
            margin-top:15px;
            color:red;
        }

        .credits{
            position:fixed;
            bottom:10px;
            left:10px;
            color:gray;
            font-size:12px;
        }

    </style>

</head>

<body>

<div class="login-box">

    <h1>Family Attendance</h1>

    <p>Login to continue</p>

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

</div>

<div class="credits">
    Done by Mohammad Ammar, Khalid Abdullah and Hamad Ahmad
</div>

</body>
</html>
